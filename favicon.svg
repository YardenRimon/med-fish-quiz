<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c3a5e"/>
      <stop offset="55%" stop-color="#062038"/>
      <stop offset="100%" stop-color="#03101d"/>
    </linearGradient>
    <linearGradient id="fishBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f7ff"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="fishFin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Ocean badge background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="10"/>

  <!-- Subtle water wave arc at bottom -->
  <path d="M56 384 Q140 352 256 382 T456 376 L456 420 Q360 448 256 422 T56 424 Z" fill="#0ea5e9" fill-opacity="0.16"/>

  <!-- Bubbles -->
  <circle cx="104" cy="146" r="18" fill="#bae6fd" fill-opacity="0.85"/>
  <circle cx="144" cy="100" r="11" fill="#7dd3fc" fill-opacity="0.75"/>

  <!-- Dorsal fin -->
  <path d="M196 184 C236 122 308 124 342 178 Z" fill="url(#fishFin)"/>

  <!-- Ventral fin -->
  <path d="M236 322 C264 366 306 364 320 322 Z" fill="url(#fishFin)"/>

  <!-- Tail fin -->
  <path d="M352 254 L448 178 C432 224 432 284 448 330 Z" fill="url(#fishFin)"/>

  <!-- Main fish body (facing left) -->
  <path d="M84 256 C132 182 246 164 364 236 C378 245 378 267 364 276 C246 348 132 330 84 256 Z" fill="url(#fishBody)"/>

  <!-- Gill curve -->
  <path d="M192 206 C214 234 214 278 192 306" fill="none" stroke="#04182b" stroke-width="14" stroke-linecap="round" stroke-opacity="0.65"/>

  <!-- Pectoral fin -->
  <path d="M214 268 C242 258 272 272 280 296 C250 302 224 290 214 268 Z" fill="#0c4a6e" fill-opacity="0.55"/>

  <!-- Eye -->
  <circle cx="148" cy="242" r="20" fill="#04182b"/>
  <circle cx="143" cy="236" r="7" fill="#ffffff"/>
</svg>
